apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    app.kubernetes.io/name: ephora-demo-app
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head><meta charset="utf-8"><title>Preview PR #{{ .Values.preview.prNumber }}</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
      main { text-align: center; }
      h1 { font-size: 3rem; margin: 0 0 .5rem; }
      code { background: #1e293b; padding: .2rem .5rem; border-radius: 4px; }
    </style></head>
    <body><main>
      <h1>🚀 Preview PR #{{ .Values.preview.prNumber }}</h1>
      <p>Révision <code>{{ .Values.preview.revision }}</code></p>
      <p>Namespace <code>{{ .Release.Namespace }}</code></p>
      <p>Déployé par <strong>ephora-operator</strong></p>
    </main></body>
    </html>
